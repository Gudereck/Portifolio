<section class="sobre-section" id="sobre">
    <div class="sobre-container">
        <h2 class="titulo-secao">Sobre Mim</h2>

        <div class="sobre-content-grid">
            <!-- Coluna da Esquerda: Imagem e Redes -->
            <div class="sobre-col-left">
                <div class="sobre-foto-container">
                    <img [src]="fotoPerfil" alt="Foto de Perfil do Gustavo">
                </div>

                <div class="redes-sociais">
                    <a href="https://github.com/Gudereck" target="_blank" title="Ver GitHub" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/gustavo-de-deus/" target="_blank" title="Ver LinkedIn" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                </div>
            </div>

            <!-- Coluna da Direita: Bio, Cargo e Habilidades -->
            <div class="sobre-col-right">
                <div class="sobre-texto">
                    <h3>Olá, eu sou o <span class="destaque-nome">{{ nome }}</span></h3>

                    <div class="typing-container">
                        <p class="typing-text">{{ titulo }}</p>
                    </div>

                    <p class="resumo">{{ resumo }}</p>
                </div>

                <div class="sobre-habilidades">
                    <h3>Minhas Habilidades Tecnológicas</h3>
                    <div class="habilidades-grid">
                        @for (hab of habilidadesPrincipais; track hab.nome) {
                        <span class="hab-badge" [attr.data-tech]="hab.nome.toLowerCase().replace(' ', '-')">
                            <i [class]="hab.icone"></i>
                            {{ hab.nome }}
                        </span>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
