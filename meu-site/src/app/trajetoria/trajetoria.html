<section class="trajetoria-section" id="trajetoria">
    <div class="trajetoria-container">
        <div class="secao-header">
            <span class="secao-eyebrow"><span class="num">02.</span> minha jornada</span>
            <h2 class="titulo-secao">Trajetória</h2>
        </div>

        <div class="timeline">
            @for (item of itens; track item.titulo) {
            <div class="timeline-item">
                <div class="timeline-marker" [class.atual]="item.atual">
                    <i class="fa-solid" [class.fa-graduation-cap]="item.tipo === 'formacao'" [class.fa-briefcase]="item.tipo === 'experiencia'"></i>
                </div>

                <div class="timeline-card">
                    <div class="timeline-topo">
                        <span class="timeline-periodo" [class.atual]="item.atual">{{ item.periodo }}</span>
                        <span class="timeline-tag">{{ item.tipo === 'formacao' ? 'Formação' : 'Experiência' }}</span>
                    </div>
                    <h3>
                        {{ item.titulo }}
                        @if (item.atual) {
                        <span class="badge-andamento">Em andamento</span>
                        }
                    </h3>
                    <span class="timeline-local">{{ item.local }}</span>
                    <p>{{ item.descricao }}</p>
                </div>
            </div>
            }
        </div>
    </div>
</section>
