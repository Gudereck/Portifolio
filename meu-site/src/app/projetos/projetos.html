<section class="projetos-section" id="projetos">
    <div class="secao-header">
        <span class="secao-eyebrow"><span class="num">03.</span> o que eu construí</span>
        <h2 class="titulo-secao">Meus Projetos</h2>
    </div>

    <div class="projetos-grid">
        @for (projeto of meusProjetos; track projeto.nome) {
        <div class="card">

            <div class="card-image">
                @if (projeto.imagens) {
                    <div class="carousel-container">
                        <button class="carousel-btn prev" (click)="prevImage(projeto)">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        
                        <div class="carousel-slide">
                            <img [src]="projeto.imagens[projeto.activeImageIndex || 0]" [alt]="'Screenshot do projeto ' + projeto.nome">
                        </div>
                        
                        <button class="carousel-btn next" (click)="nextImage(projeto)">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        
                        <div class="carousel-dots">
                            @for (img of projeto.imagens; track $index) {
                                <span class="dot" [class.active]="$index === (projeto.activeImageIndex || 0)" (click)="setSlide(projeto, $index)"></span>
                            }
                        </div>
                    </div>
                } @else {
                    <img [src]="projeto.imagem" [alt]="'Screenshot do projeto ' + projeto.nome">
                }
            </div>

            <div class="card-content">
                <h3>{{ projeto.nome }}</h3>
                <p>{{ projeto.descricao }}</p>

                <div class="tecnologias">
                    @for (tec of projeto.tecnologias; track tec) {
                    <span class="badge">{{ tec }}</span>
                    }
                </div>

                <div class="card-actions">
                    <a [href]="projeto.linkGithub" target="_blank" rel="noopener noreferrer" class="btn-github">
                        Ver no GitHub
                    </a>
                </div>
            </div>

        </div>
        }
    </div>
</section>
